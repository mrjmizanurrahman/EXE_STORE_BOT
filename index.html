<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>EXE_SHOP_BOT</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; }
    h1 { color: #333; }
    .product-card { background: white; border-radius: 10px; padding: 15px; margin: 15px auto; max-width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    button { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #006699; }
  </style>
</head>
<body>

  <h1>Welcome to EXE_SHOP_BOT</h1>
  
  <div class="product-card">
    <h3>Digital Product 1</h3>
    <p>মূল্য: ১০০ টাকা</p>
    <button onclick="orderItem('Digital Product 1', 100)">অর্ডার করুন</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // ফুলস্ক্রিন ভিউ

    function orderItem(itemName, price) {
      // অর্ডার ডেটা টেলিগ্রাম বটে পাঠানো
      tg.sendData(JSON.stringify({
        store: "EXE_SHOP_BOT",
        item: itemName,
        price: price
      }));
      tg.close();
    }
  </script>
</body>
</html>
